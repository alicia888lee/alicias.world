<style>

@font-face { font-family:"Iosevka Charon";   src:url("fonts/iosevka-charon.woff2") format("woff2");   font-weight:400 700; font-display:swap; }
@font-face { font-family:"Metal Display";     src:url("fonts/metal.woff2") format("woff2");            font-weight:400 900; font-display:swap; }
@font-face { font-family:"Pecita";            src:url("fonts/pecita.woff2") format("woff2");           font-weight:400;     font-display:swap; }
@font-face { font-family:"Momo Trust Display";src:url("fonts/momo-trust-display.woff2") format("woff2");font-weight:400 900; font-display:swap; }

  :root {
    /* animation feel */
    --speed: 90;            /* default marquee speed (px/sec); each theme can override */
    --bar-h: 10.4vh;        /* height of a normal bar (sized so all 9 bars fill one screen) */
    --bar-min: 74px;        /* never smaller than this */
    --name-h: 16.8vh;       /* the (taller) name bar */
    --name-min: 120px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }
  html, body { background: #000; overflow-x: hidden; }
  body {
    font-family: 'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* neon text-selection highlight */
  ::selection { background: #8CFF00; color: #000; }

  #app { min-height: 100vh; display: flex; flex-direction: column; }

  .section { display: flex; flex-direction: column; }

  /* ---------- the bars ---------- */
  .bar {
    height: var(--bar-h);
    min-height: var(--bar-min);
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    user-select: none;
    border: none;
    width: 100%;
    text-align: left;
    transform-origin: center center;
    transition: transform .18s cubic-bezier(.2,.7,.2,1), filter .18s ease, box-shadow .18s ease;
    will-change: transform;
  }
  .bar:hover,
  .bar:focus-visible {
    transform: scale(1.06);
    filter: brightness(1.1);
    box-shadow: 0 16px 46px rgba(0,0,0,.45);
    z-index: 20;
  }
  .bar:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }

  /* open cue: the currently-expanded bar gets an inset ring in its accent colour */
  .bar[aria-expanded="true"]::before,
  .name-bar[aria-expanded="true"]::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 5px solid currentColor;
    pointer-events: none;
    z-index: 6;
  }

  /* ---------- marquee ---------- */
  .marquee { width: 100%; height: 100%; overflow: hidden; display: flex; align-items: center; }
  .marquee-track {
    display: flex;
    width: max-content;
    will-change: transform;
    animation: marquee-ltr var(--dur, 20s) linear infinite;
  }
  .marquee-group { display: flex; flex-shrink: 0; }
  .marquee-item {
    display: block;
    white-space: nowrap;
    line-height: 1;
    padding-right: 0.4em;
    font-size: var(--size);
  }
  /* text moves left -> right, seamlessly */
  @keyframes marquee-ltr {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }

  /* ---------- per-project themes ----------
     --speed is px/sec for that bar's marquee. Higher = faster.
     All kept in a legible ~58–110 range. */
  .theme-mushi   { --bg:#22EDFF; --fg:#0436FF; --size: clamp(34px, 9.5vh, 96px); --speed:64;
                   font-family:'Schoolbell', cursive; font-weight:400; text-transform:lowercase; }
  .theme-chair   { --bg:#0436FF; --fg:#E9FF6C; --size: clamp(26px, 7.6vh, 72px); --speed:92;
                   font-family:'Archivo', sans-serif; font-weight:800; font-stretch:125%;
                   text-transform:uppercase; letter-spacing:.01em; }
  .theme-pigeon  { --bg:#00FF1E; --fg:#A600FF; --size: clamp(30px, 8.6vh, 86px); --speed:76;
                   font-family:'Metal Display', 'Playfair Display', Georgia, serif; font-weight:700; font-style:italic;
                   text-transform:uppercase; }
  .theme-friends { --bg:#FF04C0; --fg:#46F9FF; --size: clamp(30px, 8.6vh, 84px); --speed:84;
                   font-family:'Pecita', 'Gochi Hand', cursive; font-weight:400;
                   text-transform:uppercase; letter-spacing:.02em; }
  .theme-hydra   { --bg:#DDFF00; --fg:#7700FF; --size: clamp(30px, 8.8vh, 88px); --speed:58;
                   font-family:'Pirata One', cursive; font-weight:400; text-transform:uppercase; }
  .theme-frog    { --bg:#FF5900; --fg:#8CFF00; --size: clamp(30px, 8.8vh, 88px); --speed:100;
                   font-family:'Momo Trust Display', 'Arial Black', 'Helvetica Neue', sans-serif; font-weight:900; text-transform:uppercase; }
  /* NEW — colours swapped + new fonts. Change to taste (like the others above). */
  .theme-dare    { --bg:#FF0059; --fg:#00FFC2; --size: clamp(28px, 8.6vh, 86px); --speed:108;
                   font-family:'Permanent Marker', cursive; font-weight:400;
                   text-transform:uppercase; letter-spacing:.01em; }
  .theme-birdie  { --bg:#6A00FF; --fg:#C6FF00; --size: clamp(30px, 8.8vh, 90px); --speed:110;
                   font-family:'Faster One', cursive; font-weight:400; }

  /* ---------- the static name bar ---------- */
  .name-bar {
    height: var(--name-h);
    min-height: var(--name-min);
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transform-origin: center center;
    transition: transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .18s ease;
    will-change: transform;
  }
  .name-bar:hover,
  .name-bar:focus-visible {
    transform: scale(1.035);
    box-shadow: 0 16px 46px rgba(0,0,0,.5);
    z-index: 20;
  }
  .name-bar:focus-visible { outline: 4px solid #fff; outline-offset: -8px; }
  .name-text {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-stretch: 100%;
    text-transform: uppercase;
    white-space: nowrap;
    line-height: .82;
    font-size: clamp(40px, min(17.5vh, 15vw), 240px);
    padding-left: 2vw;
  }

  /* ---------- expandable panel ---------- */
  .panel {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .42s cubic-bezier(.4,0,.2,1);
    background: #fff;
    color: #111;
  }
  .panel.open { grid-template-rows: 1fr; }
  .panel-inner { overflow: hidden; }
  .panel-content {
    display: flex;
    gap: clamp(28px, 3vw, 48px);
    padding: 40px 5vw 40px;
    align-items: flex-start;
    flex-wrap: wrap;
    opacity: 0;                                   /* fades in when the panel opens */
    transition: opacity .45s ease .12s;
  }
  .panel.open .panel-content { opacity: 1; }

  /* ---------- unified media carousel ----------
     Every project's media lives in one carousel: one item on screen at a
     time, with arrows + dots to move between them. A single item hides the
     controls and just shows the photo. The copy always sits in the same
     place (the column to the right), whatever the image count or shape. */
  .carousel {
    flex: 0 0 clamp(340px, 46vw, 600px);
    max-width: 100%;
    min-width: 0;
  }
  .carousel-viewport {
    position: relative;
    overflow: hidden;
    border-radius: 2px;
    background: #fff;                     /* clean white backdrop / letterbox */
  }
  .carousel-track {
    display: flex;
    transition: transform .4s cubic-bezier(.4,0,.2,1);
    will-change: transform;
  }
  .slide {
    flex: 0 0 100%;
    min-width: 0;
    height: clamp(300px, 46vh, 480px);   /* one stable frame for every image */
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
  }
  .slide .photo {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;                 /* never crop — fit inside the frame */
    display: block;
  }
  .slide .video {
    width: 100%;
    max-height: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
  }
  .slide .video iframe { width: 100%; height: 100%; display: block; border: 0; }

  /* prev / next arrows — red flower buttons */
  .car-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 54px; height: 54px;
    border: none; background: none; padding: 0;
    cursor: pointer; z-index: 4;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.22));
    transition: transform .18s cubic-bezier(.2,.7,.2,1), filter .15s ease;
  }
  .car-btn:hover { transform: translateY(-50%) scale(1.12) rotate(10deg); filter: drop-shadow(0 2px 6px rgba(0,0,0,.28)); }
  .car-btn:active { transform: translateY(-50%) scale(.95); }
  .car-btn:focus-visible { outline: 3px solid #FF1E3C; outline-offset: 3px; }
  .car-btn svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .car-prev { left: 8px; }
  .car-next { right: 8px; }

  /* dots */
  .carousel-dots {
    display: flex; gap: 8px; justify-content: center; align-items: center;
    margin-top: 12px; flex-wrap: wrap;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    border: none; padding: 0; cursor: pointer;
    background: #cfcfcf;
    transition: background .15s ease, transform .15s ease;
  }
  .dot:hover { background: #a9a9a9; }
  .dot.active {
    width: 16px; height: 16px;
    border-radius: 0;
    background: none;
    background-color: var(--link, #0436FF);
    -webkit-mask: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cg%20fill='%23000'%3E%3Ccircle%20cx='50'%20cy='26'%20r='21'/%3E%3Ccircle%20cx='73'%20cy='43'%20r='21'/%3E%3Ccircle%20cx='64'%20cy='70'%20r='21'/%3E%3Ccircle%20cx='36'%20cy='70'%20r='21'/%3E%3Ccircle%20cx='27'%20cy='43'%20r='21'/%3E%3Ccircle%20cx='50'%20cy='50'%20r='25'/%3E%3C/g%3E%3C/svg%3E") center / contain no-repeat;
            mask: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cg%20fill='%23000'%3E%3Ccircle%20cx='50'%20cy='26'%20r='21'/%3E%3Ccircle%20cx='73'%20cy='43'%20r='21'/%3E%3Ccircle%20cx='64'%20cy='70'%20r='21'/%3E%3Ccircle%20cx='36'%20cy='70'%20r='21'/%3E%3Ccircle%20cx='27'%20cy='43'%20r='21'/%3E%3Ccircle%20cx='50'%20cy='50'%20r='25'/%3E%3C/g%3E%3C/svg%3E") center / contain no-repeat;
    transform: none;
  }
  .dot.active:hover { background-color: var(--link, #0436FF); transform: scale(1.1); }
  .dot:focus-visible { outline: 2px solid var(--link, #0436FF); outline-offset: 2px; }

  /* one item only: hide the controls, just show the photo */
  .carousel.is-single .car-btn,
  .carousel.is-single .carousel-dots { display: none; }

  /* round variant: circular frame (used by the ALICIA gif) */
  .carousel.is-round { flex: 0 0 auto; }
  .carousel.is-round .carousel-viewport {
    width: clamp(220px, 34vh, 380px);
    max-width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    margin: 0 auto;
  }
  .carousel.is-round .slide {
    height: 100%;
  }
  .carousel.is-round .slide .photo {
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    object-fit: cover;             /* fill the circle, no letterbox */
  }

  .copy { flex: 1 1 300px; min-width: 260px; }

  .copy h2 {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 2.1vw, 30px);
    text-transform: uppercase;
    letter-spacing: .01em;
    margin-bottom: 18px;
  }
  .copy p {
    font-family: system-ui, 'Helvetica Neue', Arial, sans-serif;
    font-size: 13.5px;
    line-height: 1.6;
    margin-bottom: 1em;
    max-width: 42ch;
    color: #666;          /* all paragraphs are grey + italic now */
    font-style: italic;
  }
  .copy p:last-child { margin-bottom: 0; }
  .placeholder { color: #666; font-style: italic; }

  /* in-copy links tint to each project's accent colour (set per panel in JS) */
  .copy a {
    color: var(--link, #0436FF);
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-thickness: 1.5px;
    transition: opacity .15s ease;
  }
  .copy a:hover { opacity: .65; }

  /* audio play button (frog cart -> Tokyo Drift) */
  .player { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .play-btn {
    width: 52px; height: 52px; flex: 0 0 auto;
    border: none; background: none; padding: 0; cursor: pointer;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.22));
    transition: transform .18s cubic-bezier(.2,.7,.2,1), filter .15s ease;
  }
  .play-btn:hover { transform: scale(1.1) rotate(10deg); filter: drop-shadow(0 2px 6px rgba(0,0,0,.28)); }
  .play-btn:active { transform: scale(.95); }
  .play-btn:focus-visible { outline: 3px solid #FF1E3C; outline-offset: 3px; }
  .play-btn svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .player-label {
    font-family: 'Archivo', sans-serif; font-weight: 900;
    text-transform: uppercase; letter-spacing: .03em;
    font-size: 13px; color: var(--link, #FF5900);
  }

  @media (max-width: 900px) {
    .panel-content { flex-direction: column; gap: 24px; padding: 28px 6vw 32px; }
    .carousel { flex: 0 0 auto; width: 100%; max-width: 100%; }
    .slide { height: clamp(240px, 52vw, 380px); }
    .copy { width: 100%; flex: 0 0 auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    .marquee-track { animation-play-state: paused; }
    .carousel-track { transition: none; }
    .bar:hover, .bar:focus-visible, .name-bar:hover, .name-bar:focus-visible { transform: none; }
    html { scroll-behavior: auto; }
    .panel-content { opacity: 1; transition: none; }
  }
</style>

    },
    {
      type: "project", theme: "theme-hydra",
      text: "my little hydra",
      heading: "MY LITTLE HYDRA",
      paragraphs: [
        "My Little Hydra™ is here to bring an abominable flair to your cuddly creature collection. Hug it, snuggle it, and giggle along as each head delivers the same exact blank stare. With much indifference, My Little Hydra™ teaches that friendship comes in all shapes and sizes. For ages 12 months and up."
      ],
      images: ["Hydra1.PNG", "goosetable.jpg"]
    },
    {
      type: "project", theme: "theme-frog",
      text: "frog cart",
      heading: "FROG CART",
      paragraphs: [
        "This cart has motion on many levels. His legs are powered by your gentle guidance while his back is as strong as a Mesopotamian mule. Vases, cases, bottles, and models -- your wish is his command with his 3 different shelf levels.",
        "Vroom vroom."
      ],
      images: ["frog.gif", "frog.png"],
      audio: "tokyodrift.mp3"
    },
    {
      type: "project", theme: "theme-birdie",
      text: "Pow Pow Birdie",
      heading: "POW POW BIRDIE",
      paragraphs: [
        "coming soon..."
      ],
    }
  ];

  const app = document.getElementById("app");

  /* ---- build the DOM ---- */
  bars.forEach((bar) => {
    const section = document.createElement("section");
    section.className = "section";

    if (bar.type === "name") {
      section.classList.add("name-section");

      // clickable name bar (static big text, no marquee)
      const nameBar = document.createElement("div");
      nameBar.className = "name-bar";
      nameBar.setAttribute("role", "button");
      nameBar.setAttribute("tabindex", "0");
      nameBar.setAttribute("aria-expanded", "false");
      nameBar.setAttribute("aria-label", NAME + " — about — expand");
      const span = document.createElement("span");
      span.className = "name-text";
      span.textContent = NAME;
      nameBar.appendChild(span);

      // panel (same layout as the project bars)
      const panel = document.createElement("div");
      panel.className = "panel";
      panel.style.setProperty("--link", "#6A00FF");
      const inner = document.createElement("div");
      inner.className = "panel-inner";
      const content = document.createElement("div");
      content.className = "panel-content";

      if (bar.images && bar.images.length) {
        content.appendChild(makeCarousel(bar.images, bar.heading || "ABOUT", { round: true }));
      }

      const copy = document.createElement("div");
      copy.className = "copy";
      const h2 = document.createElement("h2");
      h2.textContent = bar.heading || "ABOUT";
      copy.appendChild(h2);
      (bar.paragraphs || []).forEach((t) => {
        const p = document.createElement("p");
        if (bar.placeholder) p.className = "placeholder";
        p.innerHTML = t;
        copy.appendChild(p);
      });

      content.appendChild(copy);
      inner.appendChild(content);
      panel.appendChild(inner);

      const toggle = () => {
        const open = panel.classList.toggle("open");
        nameBar.setAttribute("aria-expanded", open ? "true" : "false");
        nameBar.setAttribute("aria-label", NAME + " — about" + (open ? " — collapse" : " — expand"));
        if (open) setTimeout(() => nameBar.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
      };
      nameBar.addEventListener("click", toggle);
      nameBar.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
      });

      section.appendChild(nameBar);
      section.appendChild(panel);
      app.appendChild(section);
      return;
    }

    // clickable bar with marquee
    const barEl = document.createElement("div");
    barEl.className = "bar " + bar.theme;
    barEl.setAttribute("role", "button");
    barEl.setAttribute("tabindex", "0");
    barEl.setAttribute("aria-expanded", "false");
    barEl.setAttribute("aria-label", bar.heading + " — expand");

    const marquee = document.createElement("div");
    marquee.className = "marquee";
    marquee.dataset.text = bar.text;
    barEl.appendChild(marquee);

    // panel
    const panel = document.createElement("div");
    panel.className = "panel";
    panel.style.setProperty("--link", LINK[bar.theme] || "#0436FF");
    const inner = document.createElement("div");
    inner.className = "panel-inner";
    const content = document.createElement("div");
    content.className = "panel-content";

    if (bar.images && bar.images.length) {
      content.appendChild(makeCarousel(bar.images, bar.heading));
    }

    const copy = document.createElement("div");
    copy.className = "copy";
    if (bar.audio) copy.appendChild(makePlayer(bar.audio, bar.audioLabel || "Play the Soundtrack"));
    const h2 = document.createElement("h2");
    h2.textContent = bar.heading;
    copy.appendChild(h2);
    bar.paragraphs.forEach((t) => {
      const p = document.createElement("p");
      if (bar.placeholder) p.className = "placeholder";
      p.innerHTML = t;
      copy.appendChild(p);
    });

    content.appendChild(copy);
    inner.appendChild(content);
    panel.appendChild(inner);

    // toggle behaviour (each bar opens/closes independently)
    const toggle = () => {
      const open = panel.classList.toggle("open");
      barEl.setAttribute("aria-expanded", open ? "true" : "false");
      barEl.setAttribute("aria-label", bar.heading + (open ? " — collapse" : " — expand"));
      if (open) {
        // let the row grow, then bring it into view
        setTimeout(() => barEl.scrollIntoView({ behavior: "smooth", block: "start" }), 60);
      }
    };
    barEl.addEventListener("click", toggle);
    barEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });

    section.appendChild(barEl);
    section.appendChild(panel);
    app.appendChild(section);
  });

  /* ---- turn a YouTube URL or bare ID into an 11-char video id, else null ---- */
  function youtubeId(s) {
    if (typeof s !== "string") return null;
    const m = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
    if (m) return m[1];
    if (/^[A-Za-z0-9_-]{11}$/.test(s)) return s;
    return null;
  }

  /* ---- one media item -> <img> for a photo, or a 16:9 <iframe> for a YouTube link ---- */
  function mediaHTML(item, heading) {
    const id = youtubeId(item);
    if (id) {
      return `<div class="video"><iframe src="https://www.youtube.com/embed/${id}" title="${heading}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>`;
    }
    return `<img class="photo" src="${item}" alt="${heading}" loading="lazy">`;
  }

  /* ---- build a media carousel: one item on screen, arrows + dots to move
     between them. A single item hides the controls and just shows the photo. ---- */
  function makeCarousel(items, heading, opts) {
    const car = document.createElement("div");
    car.className = "carousel";
    const n = items.length;
    if (n <= 1) car.classList.add("is-single");
    if (opts && opts.round) car.classList.add("is-round");

    const viewport = document.createElement("div");
    viewport.className = "carousel-viewport";

    const track = document.createElement("div");
    track.className = "carousel-track";
    track.innerHTML = items.map((it) => `<div class="slide">${mediaHTML(it, heading)}</div>`).join("");
    viewport.appendChild(track);

    const prev = document.createElement("button");
    prev.type = "button";
    prev.className = "car-btn car-prev";
    prev.setAttribute("aria-label", "Previous image");
    prev.innerHTML = CHEV_L;

    const next = document.createElement("button");
    next.type = "button";
    next.className = "car-btn car-next";
    next.setAttribute("aria-label", "Next image");
    next.innerHTML = CHEV_R;

    viewport.appendChild(prev);
    viewport.appendChild(next);
    car.appendChild(viewport);

    const dots = document.createElement("div");
    dots.className = "carousel-dots";
    items.forEach((_, i) => {
      const d = document.createElement("button");
      d.type = "button";
      d.className = "dot" + (i === 0 ? " active" : "");
      d.setAttribute("aria-label", "Go to image " + (i + 1));
      dots.appendChild(d);
    });
    car.appendChild(dots);

    if (n > 1) {
      car.dataset.idx = "0";
      const dotEls = Array.from(dots.children);
      const slides = Array.from(track.children);
      const go = (i) => {
        const idx = (i + n) % n;
        car.dataset.idx = String(idx);
        const w = viewport.clientWidth;               // integer px -> lands on the pixel grid
        if (w) {
          slides.forEach((s) => { s.style.flex = "0 0 " + w + "px"; });
          track.style.transform = "translate3d(" + (-idx * w) + "px,0,0)";
        }
        dotEls.forEach((d, j) => d.classList.toggle("active", j === idx));
      };
      prev.addEventListener("click", (e) => { e.stopPropagation(); go(parseInt(car.dataset.idx, 10) - 1); });
      next.addEventListener("click", (e) => { e.stopPropagation(); go(parseInt(car.dataset.idx, 10) + 1); });
      dotEls.forEach((d, j) => d.addEventListener("click", (e) => { e.stopPropagation(); go(j); }));
    }

    return car;
  }

  /* ---- re-snap every multi-item carousel to whole pixels (on load / resize)
     so slide edges land exactly on the pixel grid — no faint neighbour seam ---- */
  function fitCarousels() {
    document.querySelectorAll(".carousel:not(.is-single)").forEach((car) => {
      const vp = car.querySelector(".carousel-viewport");
      const track = car.querySelector(".carousel-track");
      if (!vp || !track) return;
      const w = vp.clientWidth;
      if (!w) return;
      Array.from(track.children).forEach((s) => { s.style.flex = "0 0 " + w + "px"; });
      const idx = parseInt(car.dataset.idx || "0", 10);
      track.style.transform = "translate3d(" + (-idx * w) + "px,0,0)";
    });
  }

  /* ---- audio play/pause button (e.g. Tokyo Drift under frog cart) ---- */
  function makePlayer(src, label) {
    const wrap = document.createElement("div");
    wrap.className = "player";
    const audio = document.createElement("audio");
    audio.src = src;
    audio.preload = "none";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "play-btn";
    btn.innerHTML = PLAY_SVG;
    btn.setAttribute("aria-label", "Play " + label);
    const span = document.createElement("span");
    span.className = "player-label";
    span.textContent = label;
    const sync = () => {
      const playing = !audio.paused;
      btn.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
      btn.setAttribute("aria-label", (playing ? "Pause " : "Play ") + label);
    };
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (audio.paused) audio.play().catch((err) => { console.warn("Audio couldn't play:", src, err); }); else audio.pause();
    });
    audio.addEventListener("play", sync);
    audio.addEventListener("pause", sync);
    audio.addEventListener("ended", sync);
    wrap.appendChild(btn);
    wrap.appendChild(span);
    wrap.appendChild(audio);
    return wrap;
  }

  /* ---- marquee builder: fill the width, then duplicate for a seamless loop ---- */
  function buildMarquee(marquee) {
    marquee.innerHTML = "";
    const text = marquee.dataset.text;

    const track = document.createElement("div");
    track.className = "marquee-track";
    const group = document.createElement("div");
    group.className = "marquee-group";
    track.appendChild(group);
    marquee.appendChild(track);

    // repeat the phrase until one group comfortably exceeds the viewport
    const target = window.innerWidth * 1.2;
    let guard = 0;
    do {
      const item = document.createElement("span");
      item.className = "marquee-item";
      item.textContent = text;
      group.appendChild(item);
      guard++;
    } while (group.offsetWidth < target && guard < 80);

    // clone the group -> track is [group][group], translateX(-50%) loops seamlessly
    const clone = group.cloneNode(true);
    clone.setAttribute("aria-hidden", "true");
    track.appendChild(clone);

    // speed is per-bar: read --speed from this bar's theme (falls back to root)
    const groupWidth = group.offsetWidth;
    const speed = parseFloat(getComputedStyle(marquee).getPropertyValue("--speed")) || 90;
    track.style.setProperty("--dur", (groupWidth / speed) + "s");
  }

  /* ---- keep the static name bar filled with trailing A's on any width ---- */
  function fillName() {
    const el = document.querySelector(".name-text");
    if (!el) return;
    const bar = el.parentElement;
    el.textContent = NAME;
    let guard = 0;
    while (el.scrollWidth < bar.clientWidth * 1.05 && guard < 120) {
      el.textContent += "A";
      guard++;
    }
  }

  function buildAll() {
    document.querySelectorAll(".marquee").forEach(buildMarquee);
    fillName();
    fitCarousels();
  }

  buildAll();

  // rebuild on resize (debounced) so everything stays seamless
  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(buildAll, 200);
  });

  // rebuild once fonts finish loading (widths change -> keeps loop seamless)
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(buildAll);
  }
</script>
</body>
</html>
